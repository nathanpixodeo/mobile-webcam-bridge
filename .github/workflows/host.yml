# Node host: typecheck, lint, formatting, unit and integration tests (integration tests use a
# real ffmpeg and a fake phone over TCP). Runs on changes to host/ or protocol/, or manually.
name: host

on:
  push:
    paths: ['host/**', 'protocol/**', '.github/workflows/host.yml']
  pull_request:
    paths: ['host/**', 'protocol/**', '.github/workflows/host.yml']
  workflow_dispatch:

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install ffmpeg (integration tests)
        run: choco install ffmpeg --no-progress -y
        shell: pwsh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
