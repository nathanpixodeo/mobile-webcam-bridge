# Native components: bridge-native.exe, the camera DLLs and the native unit tests (job "build"), and
# the virtual microphone driver (job "driver"). Runs on changes to native/ or protocol/, or manually.
name: native

on:
  push:
    branches: [main]
    paths:
      - native/**
      - protocol/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - protocol/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: User-mode components and tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build user-mode components and run unit tests
        shell: pwsh
        run: ./scripts/build-native.ps1 -Configuration Release -SkipDriver

      - name: Upload stage folder
        uses: actions/upload-artifact@v7
        with:
          name: native-stage
          path: native/out/Release/stage
          if-no-files-found: error

  driver:
    name: Virtual microphone driver
    # Same image and WDK NuGet packages as microsoft/Windows-driver-samples CI: the plain
    # windows-2025 image has the WDK MSBuild integration but neither kernel headers nor tools.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore the WDK NuGet packages
        run: nuget restore native\virtual-mic\packages.config -PackagesDirectory native\packages -NonInteractive

      # 64-bit MSBuild: the NuGet WDK targets locate stampinf.exe through $(Processor_Architecture),
      # which is x86 inside the default 32-bit MSBuild (TRK0005).
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build mwbmic.sys (unsigned)
        run: msbuild native\virtual-mic\virtual-mic.vcxproj -p:Configuration=Release -p:Platform=x64 -p:TargetVersion=Windows10 -nologo -clp:Verbosity=minimal

      - name: Upload driver package
        uses: actions/upload-artifact@v7
        with:
          name: driver-package
          path: native/out/Release/x64/virtual-mic
          if-no-files-found: error
