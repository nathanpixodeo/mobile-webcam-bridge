name: native

on:
  push:
    branches: [main]
    paths:
      - native/**
      - protocol/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - protocol/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The windows-2025 image ships the WDK 10.0.26100 Visual Studio component, so the driver
      # builds here too (unsigned; test signing happens locally with scripts/sign-driver.ps1).
      - name: Build all native components and run unit tests
        shell: pwsh
        run: ./scripts/build-native.ps1 -Configuration Release -RequireDriver

      - name: Upload stage folder
        uses: actions/upload-artifact@v7
        with:
          name: native-stage
          path: native/out/Release/stage
          if-no-files-found: error
