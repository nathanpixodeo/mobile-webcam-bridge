name: native

on:
  push:
    branches: [main]
    paths:
      - native/**
      - protocol/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  pull_request:
    paths:
      - native/**
      - protocol/**
      - scripts/build-native.ps1
      - .github/workflows/native.yml
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The runner has the WDK MSBuild integration but no kernel headers: the driver builds
      # against the WDK NuGet packages (unsigned; test signing happens locally).
      - name: Build all native components and run unit tests
        shell: pwsh
        run: ./scripts/build-native.ps1 -Configuration Release -RequireDriver -UseWdkNuGet

      - name: Upload stage folder
        uses: actions/upload-artifact@v7
        with:
          name: native-stage
          path: native/out/Release/stage
          if-no-files-found: error
