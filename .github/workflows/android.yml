name: android

on:
  push:
    paths:
      - "android/**"
      - "protocol/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "protocol/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and validates the wrapper JAR against the published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # The debug key is generated on first use. Reusing it keeps the APK signature stable from
      # one run to the next, so `adb install -r` can update the app in place.
      - name: Restore debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew :protocol:test :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-webcam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            android/protocol/build/reports/tests/
            android/app/build/reports/tests/
          retention-days: 7
