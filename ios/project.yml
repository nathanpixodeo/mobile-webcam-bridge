# XcodeGen spec for the iOS companion app. The .xcodeproj is generated (and git-ignored):
#   brew install xcodegen && cd ios && xcodegen generate
name: MobileWebcam

options:
  bundleIdPrefix: dev.mobilewebcambridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden by CI with the short commit hash; shown in the boot report and diagnostics.
    GIT_COMMIT: unknown
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  BridgeKit:
    path: BridgeKit

targets:
  MobileWebcam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MobileWebcam
    dependencies:
      - package: BridgeKit
    info:
      path: MobileWebcam/Info.plist
      properties:
        CFBundleDisplayName: Mobile Webcam
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GitCommit: "$(GIT_COMMIT)"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Mobile Webcam streams the camera to your computer over the USB cable so apps on the computer can use it as a webcam.
        NSMicrophoneUsageDescription: Mobile Webcam streams the microphone to your computer over the USB cable so apps on the computer can use it as a microphone.
        # Keeps microphone capture alive while the screen is locked.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobilewebcambridge.ios
        PRODUCT_NAME: MobileWebcam
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  MobileWebcam:
    build:
      targets:
        MobileWebcam: all
    run:
      config: Debug
    archive:
      config: Release
